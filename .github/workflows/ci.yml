name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify gate
    # macOS, not Ubuntu, and deliberately so.
    #
    # Four consecutive Ubuntu runs hung in `apt-get update`: the runner's
    # azure.archive.ubuntu.com mirror accepted connections and never
    # responded, and Acquire::http::Timeout did not fire on that path. One
    # run sat silent for 29.5 minutes before the job timeout killed it.
    #
    # macOS needs no system packages at all for Bevy, which removes that
    # entire failure class, and it matches the development platform
    # (aarch64-apple-darwin). Runner minutes are free because this repo is
    # public.
    #
    # To restore Linux coverage later, add a second job rather than moving
    # this one back, and pin its apt sources to archive.ubuntu.com.
    runs-on: macos-latest
    # Without this a hung step runs to GitHub's 6h job limit. Because this
    # job is a required status check, a hang would make main unmergeable
    # rather than merely slow.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Bevy is ~550 crates and builds at opt-level 3 in the dev profile,
      # so an uncached run is slow. This caches the dependency build.
      - uses: Swatinem/rust-cache@v2

      # The same gate documented in CLAUDE.md.
      - name: Toolchain verify command
        run: rustc --version && cargo --version && cargo check

      # Tests are headless (MinimalPlugins) - no GPU or display needed.
      - name: Tests
        run: cargo test
