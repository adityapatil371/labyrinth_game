name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify gate
    runs-on: ubuntu-latest
    # Without this a hung step runs to GitHub's 6h job limit. Since this job
    # is a required status check, a hang would make main unmergeable rather
    # than just slow. Fail fast and visibly instead.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Package list taken verbatim from Bevy's shipped
      # docs/linux_dependencies.md (bevy 0.19.1), Ubuntu section.
      # The dev machine is macOS; these are needed only on Linux runners.
      - name: Install Bevy Linux dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Observed failure: apt-get update retried an unreachable
          # azure.archive.ubuntu.com mirror for 38 minutes with no timeout.
          # Bound the retries, and do not let an index refresh failure block
          # the install - the packages may already be cached on the image.
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=15 || true
          sudo apt-get install -y --no-install-recommends \
            -o Acquire::Retries=3 -o Acquire::http::Timeout=15 \
            g++ pkg-config libx11-dev libasound2-dev libudev-dev libxkbcommon-x11-0

      - uses: dtolnay/rust-toolchain@stable

      # Bevy is ~550 crates and builds at opt-level 3 in the dev profile,
      # so an uncached run is slow. This caches the dependency build.
      - uses: Swatinem/rust-cache@v2

      # The same gate documented in CLAUDE.md.
      - name: Toolchain verify command
        run: rustc --version && cargo --version && cargo check

      # Tests are headless (MinimalPlugins) — no GPU or display needed.
      - name: Tests
        run: cargo test
