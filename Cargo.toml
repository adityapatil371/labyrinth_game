[package]
name = "labyrinth"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# This is a game, not a library: never publish to crates.io.
publish = false

[dependencies]
bevy = "0.19.1"
bevy_egui = "0.42.0"

# --- Fast iteration builds ---
# Source: https://bevy.org/learn/quick-start/getting-started/setup (verified 2026-08-19)
# Our own crate stays at low opt-level so it recompiles fast; dependencies
# compile optimised once and are cached. `cargo add bevy` reported:
#   "Locking 550 packages to latest Rust 1.95.0 compatible versions"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
